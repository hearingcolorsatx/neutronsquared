<!DOCTYPE HTML>

<html>
<head>
    <title>neutron squared</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="stylesheet" href="assets/css/main.css" />
</head>
<body class="is-preload">

    <!-- Header -->
    <header id="header">
        <!-- <h1></h1>
        <p><br />
        </a></p> -->
    </header>

    <!-- Player Section -->
    <div id="playerSection"></div>
    <!-- <div id="playerSection"></div> -->

    <!-- Footer -->
    <footer id="footer">
        <ul class="icons">
            <li><a href="#" onclick="loadPlayer('spotify')" class="icon brands fa-spotify custom-icon"><span class="label">Spotify</span></a></li>
            <li><a href="#" onclick="loadPlayer('apple')" class="icon brands fa-apple custom-icon"><span class="label">Apple Music</span></a></li>
            <li><a href="#" onclick="loadPlayer('soundcloud')" class="icon brands fa-soundcloud custom-icon"><span class="label">SoundCloud</span></a></li>
            <li><a href="#" onclick="loadPlayer('youtube')" class="icon brands fa-youtube custom-icon"><span class="label">YouTube Music</span></a></li>
            <!-- <li><a href="#" class="icon fa-envelope"><span class="label">Email</span></a></li> -->
        </ul>
        <ul class="copyright">
            <li>&copy; 2021-<span id="currentYear"></span> <a href="https://hearingcolors.com"> Hearing Colors LLC</a>. All rights reserved.</li>
        </ul>
    </footer>

    <!-- Scripts -->
    <script>
        const currentYear = new Date().getFullYear();
        document.getElementById('currentYear').textContent = currentYear;


        let activeService = null;

        function loadPlayer(service) {
            const playerSection = document.getElementById('playerSection');

            if (activeService === service) {
                playerSection.innerHTML = '';
                playerSection.classList.remove('active');
                activeService = null;
                return;
            }

            let playerHTML = '';

            switch (service) {
                case 'soundcloud':
                    playerHTML = `
                    <div class="player-wrapper">
                        <iframe id="soundcloud"
                            scrolling="no"
                            frameborder="no"
                            allow="autoplay"
                            src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/888528673&color=%2314102b&auto_play=true&hide_related=false&show_comments=false&show_user=true&show_reposts=false&show_teaser=false&visual=true">
                        </iframe>
                    </div>`;
                    break;

                case 'spotify':
                    playerHTML = `
                    <div class="player-wrapper">
                        <iframe style="border-radius:12px"
                            src="https://open.spotify.com/embed/track/7HX5nTBxYSohWqfEa5u0GQ?utm_source=generator"
                            height="352"
                            frameborder="0"
                            allowfullscreen=""
                            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                            loading="lazy">
                        </iframe>
                    </div>`;
                    break;

                case 'apple':
                    playerHTML = `
                    <div class="player-wrapper">
                        <iframe
                            allow="autoplay *; encrypted-media *; fullscreen *; clipboard-write"
                            frameborder="0"
                            height="175"
                            style="overflow:hidden;border-radius:10px;"
                            sandbox="allow-forms allow-popups allow-same-origin allow-scripts allow-storage-access-by-user-activation allow-top-navigation-by-user-activation"
                            src="https://embed.music.apple.com/us/album/looking-to-the-stars-for-direction-hearing-colors/1546858178?i=1546858179">
                        </iframe>
                    </div>`;
                    break;

                case 'youtube':
                    playerHTML = `
                    <div class="player-wrapper">
                        <iframe
                            width="560"
                            height="315"
                            src="https://www.youtube.com/embed/6rHCBCE3B0c?si=ryJDQS3P4MWooIgO"
                            title="YouTube video player"
                            frameborder="0"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                            referrerpolicy="strict-origin-when-cross-origin"
                            allowfullscreen>
                        </iframe>
                    </div>`;
                    break;
            }

            playerSection.innerHTML = playerHTML;
            playerSection.classList.add('active');
            activeService = service;
        }

        document.getElementById('playerSection').addEventListener('click', function(event) {
            if (event.target === this) {
                this.innerHTML = '';
                this.classList.remove('active');
                activeService = null;
            }
        });

    </script>
    <script src="assets/js/main.js"></script>

</body>
</html>
